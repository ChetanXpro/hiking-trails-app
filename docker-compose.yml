services:
  db:
    image: postgis/postgis:16-3.4
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - hiking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  martin:
    image: ghcr.io/maplibre/martin:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Local MBTiles/PMTiles files for Martin autodiscovery, including terrain_rgb.mbtiles.
      - ./data:/data
    command:
      # Martin only loads file-backed sources when the directory/file path
      # is passed as a startup connection argument.
      - /data
      # Keep PostGIS as an explicit startup connection too, instead of
      # relying on implicit env-based discovery.
      - postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hiking}

  # Kafka, Redis, or anything else purely infra goes here later --
  # same pattern: image + env_file: .env + a volume if it's stateful.

volumes:
  hiking_pgdata:
